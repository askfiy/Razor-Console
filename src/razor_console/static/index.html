<!DOCTYPE html>
<html lang="zh-CN">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="dark" name="color-scheme"/>
  <title>
   Razor Console
  </title>
  <link href="/console.css?v=3" rel="stylesheet"/>
 </head>
 <body>
  <header class="topbar">
   <a class="brand" href="/">
    <span class="brandmark">
     R
     <span>
      ／
     </span>
    </span>
    RAZOR
    <small>
     CONSOLE
    </small>
   </a>
   <div class="runtime">
    <span class="status" id="runtime-state">
     连接中
    </span>
    <button class="primary" hidden id="bind-runtime">绑定 Runtime</button>
    <button class="primary" disabled="" id="run">
     启动 Runtime
    </button>
    <button hidden id="unbind-runtime">解绑</button>
   </div>
  </header>
  <main>
   <section class="page-heading">
    <div>
     <p class="eyebrow">
      WORKSPACE / 配置工作台
     </p>
     <h1>
      运行与配置
     </h1>

    </div>
    <button id="boot-settings">
     启动设置
     <span>
      ↗
     </span>
    </button>
   </section>
   <section class="profile-bar panel">
    <div class="profile-icon">
     ▤
    </div>
    <div class="profile-picker">
     <label for="profile">
      正在编辑
     </label>
     <select aria-label="正在编辑的游戏配置" id="profile">
     </select>
    </div>
    <div class="profile-actions">
     <button id="new-profile">
      新建
     </button>
     <button id="copy-profile">
      复制
     </button>
     <button class="quiet danger" id="delete-profile">
      删除
     </button>
    </div>
    <div class="loader">
     <span id="loader-text">
      启动配置 —
     </span>
     <button class="quiet" id="use-profile">
      设为启动配置
     </button>
    </div>
   </section>
   <div class="section-heading">
    <h2>
     核心组件
     <span>
      CORE MODULES
     </span>
    </h2>

   </div>
   <section class="core-grid" id="core-grid">
   </section>
   <section class="middle-grid">
    <article class="panel input-panel">
     <div class="panel-head">
      <div>
       <p class="eyebrow">
        PLAYER
       </p>
       <h2>
        输入绑定
       </h2>
      </div>
      <button class="quiet" id="player-settings">
       全部设置 ↗
      </button>
     </div>
     <div id="player-fields">
     </div>
    </article>
    <article class="panel preview-panel"><div class="output-tabs" role="tablist" aria-label="运行输出"><button id="tab-preview" role="tab" aria-selected="true" aria-controls="output-preview">实时预览</button><button id="tab-logs" role="tab" aria-selected="false" aria-controls="output-logs" tabindex="-1">日志</button></div><section id="output-preview" role="tabpanel" aria-labelledby="tab-preview">
     <div class="panel-head">
      <div>
       <p class="eyebrow">
        LIVE VIEW
       </p>
       <h2>
        实时预览
        <span class="small-badge" id="preview-status">
         未连接
        </span>
       </h2>
      </div>
      <div class="actions">
       <select aria-label="浏览器预览刷新率" id="preview-fps">
        <option>
         30
        </option>
        <option selected="">
         60
        </option>
        <option>
         90
        </option>
        <option>
         120
        </option>
        <option>
         240
        </option>
       </select>
       <button aria-label="放大预览" id="expand-preview">
        ⛶
       </button>
       <button id="toggle-preview">开启预览</button>
      </div>
     </div>
     <div class="preview-stage">
      <img alt="Runtime 实时画面" hidden="" id="frame"/>
      <div id="frame-empty">
       <span class="preview-cross">
        ＋
       </span>
       <strong>
        等待画面输入
       </strong>
       <p>
        在启动设置中启用 Bridge 画面输出
       </p>
       <button class="quiet" id="preview-settings">
        配置画面输出 ↗
       </button>
      </div>
     </div>
     <footer class="preview-footer">
      <span id="frame-meta">
       无画面
      </span>
      <span>

      </span>
     </footer>
</section>   <section id="output-logs" role="tabpanel" aria-labelledby="tab-logs" hidden>
    <span class="muted" id="log-count">0 条</span>
    <div class="log-toolbar">
     <select aria-label="日志筛选" id="log-filter">
      <option value="all">
       全部
      </option>
      <option value="error">
       警告与错误
      </option>
      <option value="console">
       Console 事件
      </option>
     </select>
     <div>
      <button class="quiet" id="follow-logs" aria-pressed="true" title="新日志到达时自动滚动到底部">跟随：开</button>
      <button class="quiet" id="copy-logs">
       复制
      </button>
      <button class="quiet" id="clear-logs">
       清空
      </button>
     </div>
    </div>
    <div aria-live="polite" id="log-list">
    </div>
   </section>    </article>
   </section>
   <div class="section-heading">
    <h2>
     功能组件
     <span>
      COMPONENTS
     </span>
    </h2>
    <span class="muted" id="component-count">
    </span>
   </div>
   <section class="plugin-grid" id="plugin-grid">
   </section>

   <footer class="workspace-foot">
    <span id="runtime-dir">
    </span>
    <span>
     RAZOR / LOCAL WORKSPACE
    </span>
   </footer>
  </main>
  <footer class="savebar" hidden>
   <div>
    <i id="dirty-dot">
    </i>
    <strong id="save-state">
     正在读取配置…
    </strong>
    <span id="save-detail">
    </span>
   </div>
   <div class="actions">
    <button disabled="" id="discard">
     撤销修改
    </button>
    <button class="primary" disabled="" id="save" type="button">
     保存更改
     <kbd>
      Ctrl S
     </kbd>
    </button>
   </div>
  </footer>
  <dialog id="drawer">
   <form id="drawer-form">
    <header class="drawer-head">
     <div>
      <p class="eyebrow" id="drawer-eyebrow">
      </p>
      <h2 id="drawer-title" tabindex="-1" autofocus>
      </h2>
     </div>
     <button aria-label="关闭设置" class="icon-button" id="drawer-close" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
     </button>
    </header>
    <div id="drawer-content">
    </div>
   </form>
  </dialog>
  <dialog id="profile-dialog">
   <form id="profile-form">
    <p class="eyebrow">
     GAME PROFILE
    </p>
    <h2 id="profile-title">
     新建配置
    </h2>
    <label>
     文件名称
     <input autocomplete="off" id="profile-name" pattern="[A-Za-z0-9_-]+" placeholder="my_profile" required=""/>
    </label>
    <label>
     以现有配置为模板
     <select id="profile-source">
     </select>
    </label>
    <p class="muted">
     复制完整参数，避免新配置缺少运行必需的核心模块。
    </p>
    <div class="actions">
     <button id="profile-cancel" type="button">
      取消
     </button>
     <button class="primary" type="submit">
      创建配置
     </button>
    </div>
   </form>
  </dialog>
  <dialog id="preview-dialog">
   <button aria-label="关闭放大预览" id="close-preview">
    ×
   </button>
   <img alt="原始尺寸运行画面" id="large-frame"/>
  </dialog>
  <div hidden="" id="watch-banner" role="status">
   <span>
    等待按键… 键盘、鼠标按钮或滚轮 · Esc 取消
   </span>
   <button id="cancel-watch">
    取消
   </button>
  </div>
  <div id="toast" role="status">
  </div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
<h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p>
<div class="actions"><button id="confirm-cancel">取消</button><button id="confirm-accept" class="primary">继续</button></div>
</dialog>
<script src="/toml-editor.js?v=1"></script>
<script src="/console.js?v=4">
  </script>
 </body>
</html>
